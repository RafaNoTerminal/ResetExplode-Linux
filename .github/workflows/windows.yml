name: Windows portable
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests
        run: dotnet run --project windows/Diagnostico.Tests -c Release
      - name: Build portable application
        run: dotnet publish windows/Diagnostico.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o windows/artifacts/windows-x64
      - name: Smoke test real Windows UI and WMI
        shell: pwsh
        run: |
          $exe = Resolve-Path windows/artifacts/windows-x64/RBT-Diagnostico.exe
          $image = Join-Path $env:RUNNER_TEMP 'windows-ui.png'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $image) -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Smoke test excedeu 90 segundos.' }
          Get-Content windows/artifacts/windows-x64/smoke-result.txt
          if ($p.ExitCode -ne 0) { throw "Smoke falhou: $($p.ExitCode)" }
          Copy-Item $image windows/artifacts/windows-x64/windows-ui.png
      - name: Include documentation and checksums
        shell: pwsh
        run: |
          Copy-Item windows/README.md windows/artifacts/windows-x64/LEIA-ME.md
          Copy-Item LICENSE windows/artifacts/windows-x64/LICENSE
          Copy-Item LICENSE.upstream windows/artifacts/windows-x64/LICENSE.upstream
          Copy-Item THIRD_PARTY.md windows/artifacts/windows-x64/THIRD_PARTY.md
          $licenses = New-Item -ItemType Directory -Force windows/artifacts/windows-x64/Licencas-dotnet
          foreach ($package in @('microsoft.netcore.app.runtime.win-x64','microsoft.windowsdesktop.app.runtime.win-x64','system.management','system.codedom')) {
            if (-not (Test-Path "$env:USERPROFILE/.nuget/packages/$package")) { continue }
            $version = Get-ChildItem "$env:USERPROFILE/.nuget/packages/$package" -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
            Get-ChildItem $version.FullName -File | Where-Object { $_.Name -match '^(LICENSE|THIRD-PARTY-NOTICES)' } | ForEach-Object { Copy-Item $_.FullName (Join-Path $licenses.FullName "$package-$($_.Name)") }
          }
          Get-FileHash windows/artifacts/windows-x64/RBT-Diagnostico.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  RBT-Diagnostico.exe" } | Set-Content windows/artifacts/windows-x64/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RBT-Diagnostico-Windows-x64
          path: windows/artifacts/windows-x64/
          retention-days: 14
